services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: socialpilot
      MYSQL_USER: socialpilot
      MYSQL_PASSWORD: socialpilot
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
volumes:
  mysql_data:
  minio_data:
