name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    env: { DATABASE_URL: "mysql://u:p@localhost:3306/x" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm test
      - run: npm run build
